name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'internal/httpapi/web.go'
      - 'internal/httpapi/web/**'
      - 'internal/httpapi/server.go'
      - 'Dockerfile'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'internal/httpapi/web.go'
      - 'internal/httpapi/web/**'
      - 'internal/httpapi/server.go'
      - 'Dockerfile'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build Vue frontend
        working-directory: web
        run: npm run build

      - name: Verify Vite dist
        run: |
          test -s internal/httpapi/web/dist/index.html
          test -d internal/httpapi/web/dist/assets
          find internal/httpapi/web/dist -maxdepth 2 -type f -print

      - name: Build embedded server
        run: go build -o /tmp/dbops-server ./cmd/dbops-server

      - name: Smoke embedded UI
        shell: bash
        run: |
          rm -rf /tmp/dbops-web-ci
          mkdir -p /tmp/dbops-web-ci
          cat >/tmp/dbops-web-ci/server.yaml <<'EOF'
          server:
            listen: 127.0.0.1:18086
            public_url: http://127.0.0.1:18086
            data_dir: /tmp/dbops-web-ci
          storage:
            metadata_db: /tmp/dbops-web-ci/dbops.db
            metrics_db: /tmp/dbops-web-ci/metrics.db
            software_dir: /tmp/dbops-web-ci/software
            task_work_dir: /tmp/dbops-web-ci/task-work
            log_dir: /tmp/dbops-web-ci/logs
            platform_backup_dir: /tmp/dbops-web-ci/platform-backup
          scheduler:
            enabled: false
          alert:
            enabled: false
          security:
            master_key_env: DBOPS_MASTER_KEY
            package_signing_key_env: DBOPS_PACKAGE_SIGNING_KEY
          auth:
            enabled: false
          agent_gateway:
            bootstrap_token_env: DBOPS_AGENT_BOOTSTRAP_TOKEN
            allow_insecure_registration: false
          EOF

          DBOPS_MASTER_KEY='web-master-key-0123456789abcdef' \
          DBOPS_PACKAGE_SIGNING_KEY='web-package-key-0123456789abcdef' \
          DBOPS_AGENT_BOOTSTRAP_TOKEN='web-bootstrap-token' \
            /tmp/dbops-server --config /tmp/dbops-web-ci/server.yaml >/tmp/dbops-web-ci/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/dbops-web-ci/server.log 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18086/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18086/ | grep -q 'DBOps'
          curl -fsS http://127.0.0.1:18086/assets/ | grep -q .
