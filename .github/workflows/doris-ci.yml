name: Doris CI

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/doris/**'
      - 'internal/agentclient/doris.go'
      - 'internal/httpapi/**'
      - 'internal/app/**'
      - 'internal/repository/**'
      - 'internal/actionpolicy/**'
      - 'agent/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/doris-ci.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/doris/**'
      - 'internal/agentclient/doris.go'
      - 'internal/httpapi/**'
      - 'internal/app/**'
      - 'internal/repository/**'
      - 'internal/actionpolicy/**'
      - 'agent/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  doris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build binaries
        run: |
          go build -o /tmp/dbops-server ./cmd/dbops-server
          go build -o /tmp/dbops-agent ./cmd/dbops-agent

      - name: Build fake Doris client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbops-doris-ci
          mkdir -p /tmp/dbops-doris-ci/bin /tmp/dbops-doris-ci/agent /tmp/dbops-doris-ci/server
          printf '%s\n' 'doris-bootstrap-token' >/tmp/dbops-doris-ci/agent/bootstrap.token
          chmod 600 /tmp/dbops-doris-ci/agent/bootstrap.token

          cat >/tmp/dbops-doris-ci/bin/mysql <<'PY'
          #!/usr/bin/env python3
          import json, os, re, sys

          args = sys.argv[1:]
          sql = ""
          for i, arg in enumerate(args):
              if arg == "--execute" and i + 1 < len(args):
                  sql = args[i+1]
                  break

          defaults = next((x.split("=",1)[1] for x in args if x.startswith("--defaults-extra-file=")), "")
          if not defaults or not os.path.exists(defaults):
              print("missing defaults file", file=sys.stderr)
              sys.exit(2)
          if oct(os.stat(defaults).st_mode & 0o777) != "0o600":
              print("bad defaults mode", file=sys.stderr)
              sys.exit(3)

          state_path = "/tmp/dbops-doris-ci/backup-state.json"
          state = {}
          if os.path.exists(state_path):
              state = json.load(open(state_path))

          if sql.strip().upper() == "SELECT VERSION()":
              print("3.0.5")
              sys.exit(0)

          if sql.strip().upper() == "SHOW FRONTENDS":
              print("Name\tHost\tAlive\tRole")
              print("fe1\t127.0.0.1\ttrue\tFOLLOWER")
              sys.exit(0)

          if sql.strip().upper() == "SHOW BACKENDS":
              print("BackendId\tHost\tAlive\tDataUsedCapacity\tAvailCapacity")
              print("10001\t127.0.0.1\ttrue\t10 GB\t90 GB")
              print("10002\t127.0.0.2\ttrue\t12 GB\t88 GB")
              sys.exit(0)

          if "SHOW PROC '/cluster_health/tablet_health'" in sql:
              print("Item\tCount")
              print("healthy\t128")
              print("unhealthy\t0")
              sys.exit(0)

          if sql.strip().upper() == "SHOW LOAD":
              print("JobId\tLabel\tState")
              print("1\tload_ci\tFINISHED")
              sys.exit(0)

          if sql.strip().upper().startswith("BACKUP SNAPSHOT"):
              m = re.search(r"BACKUP SNAPSHOT `[^`]+`\.`([^`]+)` TO `([^`]+)`", sql, re.I)
              if not m:
                  print("invalid BACKUP SNAPSHOT", file=sys.stderr)
                  sys.exit(4)
              state = {"label": m.group(1), "repository": m.group(2), "polls": 0}
              with open(state_path, "w") as fh:
                  json.dump(state, fh)
              sys.exit(0)

          if sql.strip().upper().startswith("SHOW BACKUP FROM"):
              if not state:
                  print("SnapshotName\tState\tStatus")
                  sys.exit(0)
              state["polls"] = state.get("polls", 0) + 1
              with open(state_path, "w") as fh:
                  json.dump(state, fh)
              print("SnapshotName\tState\tStatus")
              current = "PENDING" if state["polls"] < 2 else "FINISHED"
              print(f"{state['label']}\t{current}\tOK")
              sys.exit(0)

          print("unsupported Doris SQL", file=sys.stderr)
          print(sql, file=sys.stderr)
          sys.exit(5)
          PY
          chmod +x /tmp/dbops-doris-ci/bin/mysql

      - name: Start DBOps and Agent
        shell: bash
        run: |
          cat >/tmp/dbops-doris-ci/server.yaml <<'EOF'
          server:
            listen: 127.0.0.1:18085
            public_url: http://127.0.0.1:18085
            data_dir: /tmp/dbops-doris-ci/server
          storage:
            metadata_db: /tmp/dbops-doris-ci/server/dbops.db
            metrics_db: /tmp/dbops-doris-ci/server/metrics.db
            software_dir: /tmp/dbops-doris-ci/server/software
            task_work_dir: /tmp/dbops-doris-ci/server/task-work
            log_dir: /tmp/dbops-doris-ci/server/logs
            platform_backup_dir: /tmp/dbops-doris-ci/server/platform-backup
          sqlite:
            metadata_max_open_conns: 4
            metrics_max_open_conns: 2
          task:
            workers: 2
            scan_interval_seconds: 1
            lease_seconds: 30
          scheduler:
            enabled: false
          alert:
            enabled: false
          security:
            master_key_env: DBOPS_MASTER_KEY
            package_signing_key_env: DBOPS_PACKAGE_SIGNING_KEY
          auth:
            enabled: false
          agent_gateway:
            heartbeat_timeout_seconds: 10
            websocket_path: /api/v1/agent/ws
            bootstrap_token_env: DBOPS_AGENT_BOOTSTRAP_TOKEN
            allow_insecure_registration: false
          EOF

          cat >/tmp/dbops-doris-ci/agent.yaml <<'EOF'
          server:
            url: http://127.0.0.1:18085
          agent:
            id: doris-ci-agent
            heartbeat_seconds: 1
            work_dir: /tmp/dbops-doris-ci/agent
            log_dir: /tmp/dbops-doris-ci/agent/logs
          security:
            bootstrap_token_file: /tmp/dbops-doris-ci/agent/bootstrap.token
            credential_file: /tmp/dbops-doris-ci/agent/agent.credential
            verify_server_tls: true
          executor:
            max_concurrent_tasks: 2
            allowed_actions_file: agent/agent-actions.yaml
          EOF

          DBOPS_MASTER_KEY='doris-master-key-0123456789abcdef' \
          DBOPS_PACKAGE_SIGNING_KEY='doris-package-key-0123456789abcdef' \
          DBOPS_AGENT_BOOTSTRAP_TOKEN='doris-bootstrap-token' \
            /tmp/dbops-server --config /tmp/dbops-doris-ci/server.yaml >/tmp/dbops-doris-ci/server.log 2>&1 &
          echo $! >/tmp/dbops-doris-ci/server.pid

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18085/api/v1/health >/dev/null && break
            sleep 1
          done
          /tmp/dbops-agent --config /tmp/dbops-doris-ci/agent.yaml >/tmp/dbops-doris-ci/agent.log 2>&1 &
          echo $! >/tmp/dbops-doris-ci/agent.pid

      - name: Verify Doris lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sqlite3, time, urllib.error, urllib.request

          base = "http://127.0.0.1:18085/api/v1"

          def get(path):
              with urllib.request.urlopen(base + path, timeout=5) as r:
                  return json.load(r)["data"]

          def post(path, body, expected=200):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=5) as r:
                      status, payload = r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  status, payload = e.code, json.loads(e.read().decode())
              if status != expected:
                  raise SystemExit(f"POST {path}: expected={expected} got={status} payload={payload}")
              return payload.get("data")

          def wait_task(task_id):
              last = None
              for _ in range(160):
                  last = get(f"/tasks/{task_id}")
                  if last["status"] in ("success", "failed", "timeout", "cancelled"):
                      return last
                  time.sleep(0.25)
              raise SystemExit(f"task timeout: {last}")

          agent_id = None
          for _ in range(40):
              try:
                  agents = get("/agents")
                  if agents and agents[0]["status"] == "online":
                      agent_id = agents[0]["id"]
                      break
              except Exception:
                  pass
              time.sleep(0.25)
          if not agent_id:
              raise SystemExit("Doris Agent did not register")

          instance = post("/doris/instances", {
              "agent_id": agent_id,
              "name": "DORIS-CI",
              "mysql_client": "/tmp/dbops-doris-ci/bin/mysql",
              "host": "127.0.0.1",
              "query_port": 9030,
              "database": "analytics",
              "username": "admin",
              "password": "Doris-ci-password-123",
          }, expected=201)
          if instance["db_type"] != "doris" or instance["version"] != "3.0.5":
              raise SystemExit(f"Doris onboarding invalid: {instance}")
          instance_id = instance["id"]

          status = get(f"/doris/instances/{instance_id}/status")
          if status["fe_alive"] != 1 or status["be_alive"] != 2:
              raise SystemExit(f"Doris cluster status invalid: {status}")
          if len(status.get("tablet_health", [])) == 0 or len(status.get("load_jobs", [])) == 0:
              raise SystemExit(f"Doris monitoring data missing: {status}")

          task = post(f"/doris/instances/{instance_id}/backups", {
              "repository": "repo_ci",
              "label": "snapshot_ci",
              "tables": ["fact_orders"],
          }, expected=202)
          final = wait_task(task["id"])
          if final["status"] != "success":
              raise SystemExit(f"Doris backup failed: {final}")
          result = json.loads(final["result_json"])
          if result.get("state") != "FINISHED" or result.get("label") != "snapshot_ci":
              raise SystemExit(f"Doris backup state invalid: {result}")

          backups = get(f"/doris/backups?instance_id={instance_id}")
          if len(backups) != 1 or backups[0]["backup_engine"] != "doris_snapshot" or backups[0]["status"] != "success":
              raise SystemExit(f"Doris BackupJob invalid: {backups}")
          if not backups[0]["storage_path"].startswith("doris://repo_ci/analytics/snapshot_ci"):
              raise SystemExit(f"Doris storage path invalid: {backups[0]}")

          steps = get(f"/tasks/{task['id']}/steps")
          if len(steps) != 3 or any(x["status"] != "success" for x in steps):
              raise SystemExit(f"Doris task steps invalid: {steps}")

          db = sqlite3.connect("/tmp/dbops-doris-ci/server/dbops.db")
          row = db.execute("""
              select c.encrypted_secret,c.credential_type,d.metadata_json
              from database_instances d join credentials c on c.id=d.credential_id
              where d.id=?
          """, (instance_id,)).fetchone()
          if not row or row[1] != "doris_admin" or len(row[0]) < 40:
              raise SystemExit(f"Doris credential persistence invalid: {row}")
          if "Doris-ci-password-123" in row[0] or "Doris-ci-password-123" in row[2]:
              raise SystemExit("Doris password leaked into metadata")

          print("Doris end-to-end OK", {
              "instance_id": instance_id,
              "backup_task": task["id"],
              "fe_alive": status["fe_alive"],
              "be_alive": status["be_alive"],
          })
          PY

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/dbops-doris-ci/agent.pid; then kill "$(cat /tmp/dbops-doris-ci/agent.pid)" 2>/dev/null || true; fi
          if test -f /tmp/dbops-doris-ci/server.pid; then kill "$(cat /tmp/dbops-doris-ci/server.pid)" 2>/dev/null || true; fi
          echo "--- server log ---"
          cat /tmp/dbops-doris-ci/server.log 2>/dev/null || true
          echo "--- agent log ---"
          cat /tmp/dbops-doris-ci/agent.log 2>/dev/null || true
