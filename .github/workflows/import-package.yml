name: Import DBOps package

on:
  push:
    paths:
      - '.import/READY'

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact text sources
        shell: bash
        run: |
          set -euo pipefail
          cat .import/md.000 .import/md.001 .import/md.002 > 'DBOps_V1.0_单容器版完整开发设计文档.md'
          cat .import/sql.000 .import/sql.001 > sql/schema.sqlite.sql
          printf '%s  %s\n'             'bd0c4c9b1e535aedd659d02875731b15d5646d47eadc74a67931ee546b8e5853'             'DBOps_V1.0_单容器版完整开发设计文档.md' | sha256sum -c -
          printf '%s  %s\n'             'f79425a55a5f51564e0b27df0ac53e48942837d58719f2ff0a1768854eea3731'             'sql/schema.sqlite.sql' | sha256sum -c -

      - name: Reconstruct DOCX delta
        shell: bash
        run: |
          set -euo pipefail
          cat .import/docx2.* | base64 -d > /tmp/docx_delta.zip
          printf '%s  %s\n'             'cac2c389f2a25ebb55db4b1266033019c504e4fe7ef1fcf5ecc78ddc47096aae'             '/tmp/docx_delta.zip' | sha256sum -c -

      - name: Render exact PNG diagrams
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -v "$PWD:/work"             -w /work             debian:trixie             bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends graphviz fonts-noto-cjk
              dot -V
              for f in diagrams/*.dot; do
                dot -Gdpi=160 -Tpng "$f" -o "${f%.dot}.png"
              done
            '
          rm -f diagrams/04_mysql_install_sequence.png diagrams/05_mysql_replication_sequence.png diagrams/06_archive_flow.png
          cat .import/png04.* | base64 -d > diagrams/04_mysql_install_sequence.png
          cat .import/png05.* | base64 -d > diagrams/05_mysql_replication_sequence.png
          cat .import/png06.* | base64 -d > diagrams/06_archive_flow.png
          cat > /tmp/png.sha256 <<'EOF'
          98d102d33935c042eec1e18ec8619b5299a72aef7d45a4f0ea47d40392316f36  diagrams/01_overall_architecture.png
          d5aa9f3be007ef6b28006901ee47a23e711c48a4e28f48e638d1b50faaaf1b7a  diagrams/02_deployment_topology.png
          04f7393b71b585af1d4f62bb4431c8ec72e9a26822b1e104b0740163bc2432a9  diagrams/03_task_state.png
          a6be017276acafae8def1bc5aa45b80c902b5022e187b9ca14a3a16c314d113b  diagrams/04_mysql_install_sequence.png
          55cb739a0570ec748ec8816853300bca2f1041312a80a24cd823c679781d2f6a  diagrams/05_mysql_replication_sequence.png
          605bf0cd835168ebbb28255cf165d74c51956b4996fbbc2b2442cae7b4609cb3  diagrams/06_archive_flow.png
          110f4c6ad095c4d05c90839b033a6010679b262e5de18499403e0b1bb425eb3e  diagrams/07_core_er.png
          a6de88b9bca959b834a20efd7391c15c5580fdd229498bf5712452d727c71b9a  diagrams/08_module_map.png
          1692adb72aa595d76ba0a413d10e47263d9d56e5d7a10635cb886bbbb0026eac  diagrams/09_embedded_storage.png
          EOF
          sha256sum -c /tmp/png.sha256

      - name: Rebuild DOCX and verify internal content
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/docx_delta.zip 'DBOps_V1.0_单容器版完整开发设计文档.docx'
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256

          target = Path("DBOps_V1.0_单容器版完整开发设计文档.docx")
          mapping = {
              "word/media/rId21.png": "diagrams/08_module_map.png",
              "word/media/rId32.png": "diagrams/01_overall_architecture.png",
              "word/media/rId39.png": "diagrams/02_deployment_topology.png",
              "word/media/rId49.png": "diagrams/07_core_er.png",
              "word/media/rId62.png": "diagrams/03_task_state.png",
              "word/media/rId75.png": "diagrams/04_mysql_install_sequence.png",
              "word/media/rId86.png": "diagrams/05_mysql_replication_sequence.png",
              "word/media/rId100.png": "diagrams/06_archive_flow.png",
              "word/media/rId120.png": "diagrams/09_embedded_storage.png",
          }
          with ZipFile(target, "a") as z:
              for arcname, src in mapping.items():
                  z.writestr(arcname, Path(src).read_bytes())

          with ZipFile(target, "r") as z:
              names = z.namelist()
              if len(names) != 34 or len(set(names)) != 34:
                  raise SystemExit(f"unexpected DOCX entry count: {len(names)}")
              rows = []
              for name in sorted(names):
                  rows.append(
                      name.encode("utf-8") + b"\0" +
                      sha256(z.read(name)).hexdigest().encode("ascii") + b"\n"
                  )
              manifest_hash = sha256(b"".join(rows)).hexdigest()
              expected = "a092350dc2c2a9cb7c574e925b774d3f4cf2a0b6d61711e9af10af243c133c76"
              print("DOCX internal manifest SHA256:", manifest_hash)
              if manifest_hash != expected:
                  raise SystemExit("DOCX internal content mismatch")
          PY

      - name: Commit reconstructed package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             'DBOps_V1.0_单容器版完整开发设计文档.md'             'DBOps_V1.0_单容器版完整开发设计文档.docx'             sql/schema.sqlite.sql             diagrams/*.png
          if git diff --cached --quiet; then
            echo 'No reconstructed file changes.'
            exit 0
          fi
          git commit -m 'Import DBOps V1.0 complete design package'
          git push origin HEAD:main
