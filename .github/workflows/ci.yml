name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Unit tests
        run: go test ./...

      - name: Build server and agent
        run: |
          go build -o /tmp/dbops-server ./cmd/dbops-server
          go build -o /tmp/dbops-agent ./cmd/dbops-agent

      - name: End-to-end secure MySQL install
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbops-ci /tmp/dbops-agent-ci /tmp/dbops-mysql-ci /tmp/dbops-fake-pkg
          mkdir -p /tmp/dbops-agent-ci /tmp/dbops-mysql-ci /tmp/dbops-fake-pkg

          printf '%s\n' 'ci-bootstrap-token' >/tmp/dbops-agent-ci/bootstrap.token
          chmod 600 /tmp/dbops-agent-ci/bootstrap.token

          cat >/tmp/dbops-server.yaml <<'EOF'
          server:
            listen: 127.0.0.1:18080
            public_url: http://127.0.0.1:18080
            data_dir: /tmp/dbops-ci
          storage:
            metadata_db: /tmp/dbops-ci/dbops.db
            metrics_db: /tmp/dbops-ci/metrics.db
            software_dir: /tmp/dbops-ci/software
            task_work_dir: /tmp/dbops-ci/task-work
            log_dir: /tmp/dbops-ci/logs
            platform_backup_dir: /tmp/dbops-ci/platform-backup
          sqlite:
            metadata_max_open_conns: 4
            metrics_max_open_conns: 2
          task:
            workers: 2
            scan_interval_seconds: 1
            lease_seconds: 30
          scheduler:
            enabled: false
          alert:
            enabled: false
          security:
            master_key_env: DBOPS_MASTER_KEY
            package_signing_key_env: DBOPS_PACKAGE_SIGNING_KEY
          mysql_install:
            allow_process_mode: true
          agent_gateway:
            heartbeat_timeout_seconds: 10
            websocket_path: /api/v1/agent/ws
            bootstrap_token_env: DBOPS_AGENT_BOOTSTRAP_TOKEN
            allow_insecure_registration: false
          EOF

          cat >/tmp/dbops-agent.yaml <<'EOF'
          server:
            url: http://127.0.0.1:18080
          agent:
            id: ci-agent
            heartbeat_seconds: 1
            work_dir: /tmp/dbops-agent-ci
            log_dir: /tmp/dbops-agent-ci/logs
          security:
            bootstrap_token_file: /tmp/dbops-agent-ci/bootstrap.token
            credential_file: /tmp/dbops-agent-ci/agent.credential
            verify_server_tls: true
          executor:
            max_concurrent_tasks: 1
            allowed_actions_file: agent/agent-actions.yaml
          EOF

          python3 - <<'PY'
          import io, os, tarfile, textwrap

          root = "/tmp/dbops-fake-pkg/mysql-fake/bin"
          os.makedirs(root, exist_ok=True)

          mysqld = r'''#!/usr/bin/env python3
          import configparser, os, socket, subprocess, sys, time

          args = sys.argv[1:]
          cfg_path = ""
          for a in args:
              if a.startswith("--defaults-file="):
                  cfg_path = a.split("=", 1)[1]

          if not cfg_path:
              print("missing defaults file", file=sys.stderr)
              sys.exit(2)

          cfg = configparser.ConfigParser()
          cfg.read(cfg_path)
          m = cfg["mysqld"]

          if "--validate-config" in args:
              sys.exit(0)

          if "--initialize-insecure" in args:
              datadir = m["datadir"]
              os.makedirs(datadir, exist_ok=True)
              with open(os.path.join(datadir, "auto.cnf"), "w") as f:
                  f.write("[auto]\nserver-uuid=fake-ci\n")
              sys.exit(0)

          if "--daemonize" in args:
              port = int(m["port"])
              pidfile = m["pid-file"]
              code = r"""
          import os, socket, sys
          port = int(sys.argv[1])
          pidfile = sys.argv[2]
          os.makedirs(os.path.dirname(pidfile), exist_ok=True)
          with open(pidfile, "w") as f:
              f.write(str(os.getpid()))
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", port))
          s.listen(16)
          while True:
              c, _ = s.accept()
              c.close()
          """
              subprocess.Popen(
                  [sys.executable, "-c", code, str(port), pidfile],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  start_new_session=True,
              )
              for _ in range(30):
                  if os.path.exists(pidfile):
                      sys.exit(0)
                  time.sleep(0.1)
              sys.exit(3)

          sys.exit(0)
          '''

          mysql = r'''#!/usr/bin/env python3
          import sys
          query = ""
          if "-e" in sys.argv:
              i = sys.argv.index("-e")
              if i + 1 < len(sys.argv):
                  query = sys.argv[i + 1]
          else:
              query = sys.stdin.read()
          if "SHOW INDEX" in query and "PRIMARY" in query:
              print("t\t0\tPRIMARY\t1\tid\tA\t1\tNone\tNone\t\tBTREE")
          sys.exit(0)
          '''

          mysqladmin = r'''#!/usr/bin/env python3
          import sys
          sys.exit(0)
          '''

          mysqldump = r'''#!/usr/bin/env python3
          import sys
          print("-- fake mysqldump for dbops CI")
          print("CREATE DATABASE IF NOT EXISTS dbops_ci;")
          print("CREATE TABLE dbops_ci.t(id INT PRIMARY KEY);")
          print("INSERT INTO dbops_ci.t VALUES (1);")
          sys.exit(0)
          '''

          pt_archiver = r'''#!/usr/bin/env python3
          import os, sys, time

          args = sys.argv[1:]
          if "--dry-run" in args:
              print("pt-archiver dry-run OK")
              sys.exit(0)

          def arg(name, default=""):
              if name not in args:
                  return default
              i = args.index(name)
              return args[i + 1] if i + 1 < len(args) else default

          where = arg("--where")
          sentinel = arg("--sentinel")
          marker = sentinel + ".paused-once" if sentinel else ""

          if "999999" in where and marker and not os.path.exists(marker):
              for _ in range(150):
                  if os.path.exists(sentinel):
                      mode = open(sentinel).read().strip()
                      if mode == "pause":
                          open(marker, "w").write("1")
                          print("DBOPS_ROWS scanned=25 archived=25 deleted=0")
                          print("pt-archiver paused at sentinel")
                          sys.exit(0)
                      if mode == "stop":
                          print("DBOPS_ROWS scanned=10 archived=10 deleted=0")
                          print("pt-archiver stopped at sentinel")
                          sys.exit(0)
                  time.sleep(0.1)
              print("DBOPS_ROWS scanned=50 archived=50 deleted=0")
              sys.exit(0)

          if "999999" in where:
              print("DBOPS_ROWS scanned=75 archived=75 deleted=0")
              print("pt-archiver resumed and completed")
              sys.exit(0)

          print("DBOPS_ROWS scanned=100 archived=100 deleted=0")
          print("pt-archiver statistics: 100 rows")
          sys.exit(0)
          '''

          for name, content in {
              "mysqld": mysqld,
              "mysql": mysql,
              "mysqladmin": mysqladmin,
              "mysqldump": mysqldump,
              "pt-archiver": pt_archiver,
          }.items():
              path = os.path.join(root, name)
              with open(path, "w") as f:
                  f.write(textwrap.dedent(content).lstrip())
              os.chmod(path, 0o755)

          archive = "/tmp/mysql-fake-8.0.99-linux-amd64.tar.gz"
          with tarfile.open(archive, "w:gz") as tf:
              tf.add("/tmp/dbops-fake-pkg/mysql-fake", arcname="mysql-fake")
          print(archive)
          PY

          DBOPS_AGENT_BOOTSTRAP_TOKEN=ci-bootstrap-token           DBOPS_MASTER_KEY=ci-master-key-0123456789abcdef           DBOPS_PACKAGE_SIGNING_KEY=ci-package-signing-key-0123456789abcdef             /tmp/dbops-server --config /tmp/dbops-server.yaml >/tmp/dbops-server.log 2>&1 &
          SERVER_PID=$!
          AGENT_PID=""
          MYSQL_PID=""
          trap 'kill "$SERVER_PID" ${AGENT_PID:-} ${MYSQL_PID:-} 2>/dev/null || true; echo "--- server log ---"; cat /tmp/dbops-server.log 2>/dev/null || true; echo "--- agent log ---"; cat /tmp/dbops-agent.log 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null

          /tmp/dbops-agent --config /tmp/dbops-agent.yaml >/tmp/dbops-agent.log 2>&1 &
          AGENT_PID=$!

          python3 - <<'PY'
          import json, os, stat, time, urllib.request

          base = "http://127.0.0.1:18080/api/v1"

          def get(path):
              with urllib.request.urlopen(base + path, timeout=5) as r:
                  return json.load(r)["data"]

          agent_id = None
          for _ in range(30):
              try:
                  agents = get("/agents")
                  if agents and agents[0]["status"] == "online":
                      agent_id = agents[0]["id"]
                      break
              except Exception:
                  pass
              time.sleep(1)
          if not agent_id:
              raise SystemExit("agent did not securely register")
          host_id = agents[0].get("host_id")
          if not host_id:
              raise SystemExit(f"agent has no bound host: {agents[0]}")

          metric = None
          for _ in range(30):
              try:
                  metric = get(f"/metrics/latest?resource_type=host&resource_id={host_id}")
                  if "memory_used_pct" in metric.get("payload", {}):
                      break
              except Exception:
                  pass
              time.sleep(1)
          if not metric or "memory_used_pct" not in metric.get("payload", {}):
              raise SystemExit(f"host metrics were not persisted: {metric}")
          metric_range = get(f"/metrics/range?resource_type=host&resource_id={host_id}&granularity=5m")
          if not metric_range:
              raise SystemExit("5m metric range is empty")
          print("embedded host metrics OK", {
              "host_id": host_id,
              "memory_used_pct": metric["payload"].get("memory_used_pct"),
              "root_used_pct": metric["payload"].get("root_used_pct"),
          })

          credential = "/tmp/dbops-agent-ci/agent.credential"
          for _ in range(20):
              if os.path.exists(credential):
                  break
              time.sleep(0.25)
          if not os.path.exists(credential):
              raise SystemExit("persistent agent credential was not created")
          if stat.S_IMODE(os.stat(credential).st_mode) != 0o600:
              raise SystemExit("agent credential permissions are not 0600")

          print(agent_id)
          with open("/tmp/agent-id", "w") as f:
              f.write(str(agent_id))
          PY

          UPLOAD_JSON=$(curl -fsS -X POST http://127.0.0.1:18080/api/v1/software/packages             -F software_name=mysql             -F version=8.0.99             -F os_family=linux             -F architecture=amd64             -F package_type=tar.gz             -F compatibility_json='{"test_package":true}'             -F file=@/tmp/mysql-fake-8.0.99-linux-amd64.tar.gz)
          printf '%s' "$UPLOAD_JSON" >/tmp/upload.json

          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/upload.json"))["data"]
          assert data["software_name"] == "mysql"
          assert len(data["sha256"]) == 64
          assert data["size_bytes"] > 0
          open("/tmp/package-id", "w").write(str(data["id"]))
          print("software package uploaded", data["id"], data["sha256"])
          PY

          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          base = "http://127.0.0.1:18080/api/v1"
          agent_id = int(open("/tmp/agent-id").read())
          package_id = int(open("/tmp/package-id").read())

          body = {
              "agent_id": agent_id,
              "package_id": package_id,
              "name": "mysql-ci-13306",
              "port": 13306,
              "base_dir": "/tmp/dbops-mysql-ci/base",
              "data_dir": "/tmp/dbops-mysql-ci/data",
              "log_dir": "/tmp/dbops-mysql-ci/log",
              "binlog_dir": "/tmp/dbops-mysql-ci/binlog",
              "run_dir": "/tmp/dbops-mysql-ci/run",
              "config_path": "/tmp/dbops-mysql-ci/etc/my.cnf",
              "service_name": "dbops-mysql-ci-13306",
              "service_mode": "process",
              "mysql_user": "dbops-ci-user",
              "manage_os_user": False,
              "innodb_buffer_pool_bytes": 134217728,
              "max_connections": 100,
              "min_free_bytes": 1,
              "min_memory_bytes": 1,
              "min_cpu_cores": 1,
          }

          req = urllib.request.Request(
              base + "/mysql/install",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=5) as r:
              task = json.load(r)["data"]
          task_id = task["id"]

          final = None
          for _ in range(120):
              with urllib.request.urlopen(base + f"/tasks/{task_id}", timeout=5) as r:
                  final = json.load(r)["data"]
              if final["status"] in ("success", "failed", "timeout", "cancelled"):
                  break
              time.sleep(0.5)

          if final is None or final["status"] != "success":
              raise SystemExit(f"mysql.install failed: {final}")

          with urllib.request.urlopen(base + f"/tasks/{task_id}/steps", timeout=5) as r:
              steps = json.load(r)["data"]
          by_no = {s["step_no"]: s for s in steps}
          missing = [n for n in range(1, 22) if n not in by_no]
          bad = [(n, by_no[n]["status"]) for n in by_no if by_no[n]["status"] != "success"]
          if missing or bad:
              raise SystemExit(f"step verification failed missing={missing} bad={bad} steps={steps}")

          with urllib.request.urlopen(base + "/databases", timeout=5) as r:
              databases = json.load(r)["data"]
          matches = [d for d in databases if d["port"] == 13306 and d["db_type"] == "mysql"]
          if len(matches) != 1 or matches[0]["managed_mode"] != "installed":
              raise SystemExit(f"database auto-registration failed: {databases}")

          result_text = final["result_json"]
          if "root_password" in result_text:
              raise SystemExit("root password leaked into task result")

          with urllib.request.urlopen(base + f"/tasks/{task_id}/events", timeout=5) as r:
              events = json.load(r)["data"]
          if "root_password" in json.dumps(events):
              raise SystemExit("root password leaked into task events")

          open("/tmp/install-task-id", "w").write(str(task_id))
          print("mysql.install end-to-end OK", {
              "task_id": task_id,
              "instance_id": matches[0]["id"],
              "steps": len(steps),
          })

          instance_id = matches[0]["id"]
          backup_body = {
              "all_databases": True,
              "output_dir": "/tmp/dbops-mysql-ci/backups",
              "file_name": "ci-full.sql.gz",
          }
          req = urllib.request.Request(
              base + f"/mysql/instances/{instance_id}/backups",
              data=json.dumps(backup_body).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=5) as r:
              backup_task = json.load(r)["data"]
          backup_task_id = backup_task["id"]

          backup_final = None
          for _ in range(120):
              with urllib.request.urlopen(base + f"/tasks/{backup_task_id}", timeout=5) as r:
                  backup_final = json.load(r)["data"]
              if backup_final["status"] in ("success", "failed", "timeout", "cancelled"):
                  break
              time.sleep(0.5)
          if not backup_final or backup_final["status"] != "success":
              raise SystemExit(f"mysql.backup failed: {backup_final}")

          with urllib.request.urlopen(base + f"/tasks/{backup_task_id}/steps", timeout=5) as r:
              backup_steps = json.load(r)["data"]
          if len(backup_steps) != 4 or any(s["status"] != "success" for s in backup_steps):
              raise SystemExit(f"backup steps invalid: {backup_steps}")

          with urllib.request.urlopen(base + f"/mysql/backups?instance_id={instance_id}", timeout=5) as r:
              backups = json.load(r)["data"]
          if len(backups) != 1 or backups[0]["status"] != "success":
              raise SystemExit(f"backup job registration failed: {backups}")
          if len(backups[0].get("checksum", "")) != 64 or backups[0].get("size_bytes", 0) <= 0:
              raise SystemExit(f"backup checksum/size invalid: {backups[0]}")
          if not os.path.exists(backups[0]["storage_path"]):
              raise SystemExit(f"backup file missing: {backups[0]['storage_path']}")

          open("/tmp/backup-task-id", "w").write(str(backup_task_id))
          print("mysql.backup end-to-end OK", {
              "task_id": backup_task_id,
              "backup_job_id": backups[0]["id"],
              "size_bytes": backups[0]["size_bytes"],
              "sha256": backups[0]["checksum"],
          })

          def api_post(path, body=None, expect_error=False):
              data = json.dumps(body or {}).encode()
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return json.load(r)["data"]
              except urllib.error.HTTPError as e:
                  if expect_error:
                      return {"status": e.code, "body": e.read().decode()}
                  raise

          def wait_task(task_id, attempts=160):
              final = None
              for _ in range(attempts):
                  with urllib.request.urlopen(base + f"/tasks/{task_id}", timeout=5) as r:
                      final = json.load(r)["data"]
                  if final["status"] in ("success", "failed", "timeout", "cancelled"):
                      return final
                  time.sleep(0.25)
              raise SystemExit(f"task did not finish: {final}")

          def get_jobs(policy_id):
              with urllib.request.urlopen(base + f"/mysql/archive/jobs?policy_id={policy_id}", timeout=5) as r:
                  return json.load(r)["data"]

          policy_body = {
              "name": "archive-fast",
              "source_instance_id": instance_id,
              "source_database": "dbops_ci",
              "source_table": "t",
              "where_template": "id < 100",
              "destination_type": "same_instance",
              "destination_database": "dbops_ci",
              "destination_table": "t_archive",
              "batch_size": 1000,
              "txn_size": 1000,
              "sleep_ms": 10,
              "max_replication_lag": 30,
              "delete_source": False,
              "pt_archiver_path": "/tmp/dbops-mysql-ci/base/bin/pt-archiver",
          }
          policy = api_post("/mysql/archive/policies", policy_body)
          precheck = api_post(f"/mysql/archive/policies/{policy['id']}/precheck", {})
          if precheck.get("ok") is not True:
              raise SystemExit(f"archive policy precheck failed: {precheck}")

          archive_task = api_post(f"/mysql/archive/policies/{policy['id']}/start", {"confirmed": True})
          archive_final = wait_task(archive_task["id"])
          if archive_final["status"] != "success":
              raise SystemExit(f"mysql.archive failed: {archive_final}")

          with urllib.request.urlopen(base + f"/tasks/{archive_task['id']}/steps", timeout=5) as r:
              archive_steps = json.load(r)["data"]
          if len(archive_steps) != 3 or any(s["status"] != "success" for s in archive_steps):
              raise SystemExit(f"archive steps invalid: {archive_steps}")

          archive_jobs = get_jobs(policy["id"])
          if len(archive_jobs) != 1 or archive_jobs[0]["status"] != "success":
              raise SystemExit(f"archive job registration failed: {archive_jobs}")
          if archive_jobs[0]["archived_rows"] != 100 or archive_jobs[0]["deleted_rows"] != 0:
              raise SystemExit(f"archive row counters invalid: {archive_jobs[0]}")
          normal_job = archive_jobs[0]

          slow_policy_body = dict(policy_body)
          slow_policy_body["name"] = "archive-pause-resume"
          slow_policy_body["where_template"] = "id < 999999"
          slow_policy = api_post("/mysql/archive/policies", slow_policy_body)
          slow_task = api_post(f"/mysql/archive/policies/{slow_policy['id']}/start", {"confirmed": True})

          slow_job = None
          for _ in range(80):
              jobs = get_jobs(slow_policy["id"])
              if jobs and jobs[0]["status"] == "running":
                  slow_job = jobs[0]
                  break
              time.sleep(0.25)
          if not slow_job:
              raise SystemExit(f"slow archive never entered running state: {get_jobs(slow_policy['id'])}")

          pause_task = api_post(f"/mysql/archive/jobs/{slow_job['id']}/pause", {})
          pause_final = wait_task(pause_task["id"])
          if pause_final["status"] != "success":
              raise SystemExit(f"archive pause control failed: {pause_final}")
          slow_first = wait_task(slow_task["id"])
          if slow_first["status"] != "success":
              raise SystemExit(f"paused archive task failed: {slow_first}")

          paused_job = get_jobs(slow_policy["id"])[0]
          if paused_job["status"] != "paused" or paused_job["archived_rows"] != 25:
              raise SystemExit(f"archive did not pause cleanly: {paused_job}")

          resume_task = api_post(f"/mysql/archive/jobs/{slow_job['id']}/resume", {})
          resume_final = wait_task(resume_task["id"])
          if resume_final["status"] != "success":
              raise SystemExit(f"archive resume failed: {resume_final}")
          resumed_job = get_jobs(slow_policy["id"])[0]
          if resumed_job["status"] != "success" or resumed_job["archived_rows"] != 100:
              raise SystemExit(f"archive resume counters invalid: {resumed_job}")

          stop_policy_body = dict(slow_policy_body)
          stop_policy_body["name"] = "archive-stop"
          stop_policy = api_post("/mysql/archive/policies", stop_policy_body)
          stop_run_task = api_post(f"/mysql/archive/policies/{stop_policy['id']}/start", {"confirmed": True})

          stop_job = None
          for _ in range(80):
              jobs = get_jobs(stop_policy["id"])
              if jobs and jobs[0]["status"] == "running":
                  stop_job = jobs[0]
                  break
              time.sleep(0.25)
          if not stop_job:
              raise SystemExit("stop archive never entered running state")

          rejected = api_post(f"/mysql/archive/jobs/{stop_job['id']}/stop", {"confirmed": False}, expect_error=True)
          if rejected.get("status") != 400:
              raise SystemExit(f"R3 archive stop should be rejected without confirmation: {rejected}")

          stop_task = api_post(f"/mysql/archive/jobs/{stop_job['id']}/stop", {"confirmed": True})
          stop_control = wait_task(stop_task["id"])
          if stop_control["status"] != "success":
              raise SystemExit(f"archive stop control failed: {stop_control}")
          stop_run = wait_task(stop_run_task["id"])
          if stop_run["status"] != "success":
              raise SystemExit(f"stopped archive task failed unexpectedly: {stop_run}")
          stopped_job = get_jobs(stop_policy["id"])[0]
          if stopped_job["status"] != "stopped":
              raise SystemExit(f"archive stop state invalid: {stopped_job}")

          open("/tmp/archive-task-id", "w").write(str(archive_task["id"]))
          open("/tmp/archive-job-id", "w").write(str(normal_job["id"]))
          open("/tmp/archive-policy-id", "w").write(str(policy["id"]))
          print("mysql.archive policy/job end-to-end OK", {
              "normal_job": normal_job["id"],
              "pause_resume_job": slow_job["id"],
              "stopped_job": stop_job["id"],
          })
          PY

          python3 - <<'PY'
          import json, os, sqlite3

          db = sqlite3.connect("/tmp/dbops-ci/dbops.db")
          cur = db.cursor()

          task_id = int(open("/tmp/install-task-id").read())
          params = cur.execute("select parameters_json from tasks where id=?", (task_id,)).fetchone()[0]
          if "root_password" in params:
              raise SystemExit("root password leaked into durable task parameters")

          cred = cur.execute("select encrypted_secret from credentials where credential_type='mysql_root' order by id desc limit 1").fetchone()
          if not cred or len(cred[0]) < 40:
              raise SystemExit("encrypted MySQL credential missing")

          sid = cur.execute("select server_id,status,instance_id from mysql_server_ids where port=13306").fetchone()
          if not sid or sid[1] != "bound" or not sid[2]:
              raise SystemExit(f"server_id was not bound: {sid}")

          pkg = cur.execute("select sha256,size_bytes,status from software_packages where software_name='mysql'").fetchone()
          if not pkg or len(pkg[0]) != 64 or pkg[1] <= 0 or pkg[2] != "available":
              raise SystemExit(f"software package metadata invalid: {pkg}")

          print("SQLite install facts OK", {"server_id": sid[0], "credential_ciphertext_len": len(cred[0])})

          backup_task_id = int(open("/tmp/backup-task-id").read())
          backup_params = cur.execute("select parameters_json from tasks where id=?", (backup_task_id,)).fetchone()[0]
          if "root_password" in backup_params:
              raise SystemExit("root password leaked into backup task parameters")
          backup_row = cur.execute("select status,size_bytes,checksum,storage_path from backup_jobs where task_id=?", (backup_task_id,)).fetchone()
          if not backup_row or backup_row[0] != "success" or backup_row[1] <= 0 or len(backup_row[2]) != 64:
              raise SystemExit(f"backup job facts invalid: {backup_row}")
          print("SQLite backup facts OK", backup_row[:3])

          archive_task_id = int(open("/tmp/archive-task-id").read())
          archive_params = cur.execute("select parameters_json from tasks where id=?", (archive_task_id,)).fetchone()[0]
          if "root_password" in archive_params:
              raise SystemExit("root password leaked into archive task parameters")
          archive_row = cur.execute("select status,archived_rows,deleted_rows,verification_status from archive_jobs where task_id=?", (archive_task_id,)).fetchone()
          if not archive_row or archive_row[0] != "success" or archive_row[1] != 100 or archive_row[2] != 0:
              raise SystemExit(f"archive job facts invalid: {archive_row}")
          print("SQLite archive facts OK", archive_row)
          PY

          test -s /tmp/dbops-mysql-ci/data/auto.cnf
          grep -q '^port=13306$' /tmp/dbops-mysql-ci/etc/my.cnf
          grep -q '^server_id=' /tmp/dbops-mysql-ci/etc/my.cnf
          test -s /tmp/dbops-agent-ci/tasks/$(cat /tmp/install-task-id)/mysql-install.json

          MYSQL_PID=$(cat /tmp/dbops-mysql-ci/run/mysqld.pid)
          kill "$MYSQL_PID"
          MYSQL_PID=""

          rm -f /tmp/dbops-agent-ci/bootstrap.token
          kill "$AGENT_PID"
          wait "$AGENT_PID" || true
          /tmp/dbops-agent --config /tmp/dbops-agent.yaml >>/tmp/dbops-agent.log 2>&1 &
          AGENT_PID=$!

          python3 - <<'PY'
          import json, time, urllib.request
          url = "http://127.0.0.1:18080/api/v1/agents"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as r:
                      agents = json.load(r)["data"]
                  if agents and agents[0]["status"] == "online":
                      print("persistent credential reconnect OK")
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("agent did not reconnect using persistent credential")
          PY
