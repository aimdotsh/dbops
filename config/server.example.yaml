server:
  listen: 0.0.0.0:8080
  public_url: http://127.0.0.1:8080
  # tls_cert_file: /etc/dbops/server.crt
  # tls_key_file: /etc/dbops/server.key
  # agent_ca_file: /etc/dbops/agent-ca.crt
  data_dir: /data/dbops

storage:
  metadata_db: /data/dbops/dbops.db
  metrics_db: /data/dbops/metrics.db
  software_dir: /data/dbops/software
  task_work_dir: /data/dbops/task-work
  log_dir: /data/dbops/logs
  platform_backup_dir: /data/dbops/platform-backup

sqlite:
  busy_timeout_ms: 5000
  metadata_max_open_conns: 8
  metrics_max_open_conns: 4

task:
  workers: 8
  # Same-agent ordinary tasks are serialized; this legacy field is reserved.
  max_per_host: 1
  scan_interval_seconds: 2
  lease_seconds: 60
  # Renewal is automatically lease_seconds / 3.
  lease_renew_seconds: 20

scheduler:
  enabled: true
  scan_interval_seconds: 10

alert:
  enabled: true
  evaluate_seconds: 15

security:
  master_key_env: DBOPS_MASTER_KEY
  package_signing_key_env: DBOPS_PACKAGE_SIGNING_KEY

auth:
  enabled: true
  jwt_secret_env: DBOPS_JWT_SECRET
  access_minutes: 15
  refresh_hours: 168
  bootstrap_admin_username: admin
  bootstrap_admin_password_env: DBOPS_ADMIN_PASSWORD

mysql_install:
  allow_process_mode: false

agent_gateway:
  heartbeat_timeout_seconds: 90
  websocket_path: /api/v1/agent/ws
  bootstrap_token_env: DBOPS_AGENT_BOOTSTRAP_TOKEN
  allow_insecure_registration: false
  require_mtls: false

metrics_retention:
  days_5m: 30
  days_1h: 180
  days_1d: 730
