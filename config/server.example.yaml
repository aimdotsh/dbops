server:
  listen: 0.0.0.0:8080
  public_url: http://127.0.0.1:8080
  data_dir: /data/dbops
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

storage:
  metadata_db: /data/dbops/dbops.db
  metrics_db: /data/dbops/metrics.db
  software_dir: /data/dbops/software
  task_work_dir: /data/dbops/task-work
  log_dir: /data/dbops/logs
  platform_backup_dir: /data/dbops/platform-backup

sqlite:
  journal_mode: WAL
  synchronous: NORMAL
  busy_timeout_ms: 5000
  metadata_max_open_conns: 8
  metrics_max_open_conns: 4

task:
  workers: 8
  max_per_host: 2
  scan_interval_seconds: 2
  lease_seconds: 60
  lease_renew_seconds: 20

scheduler:
  enabled: true
  scan_interval_seconds: 10
  default_misfire_policy: run_once

metrics:
  heartbeat_seconds: 30
  latest_ring_minutes: 60
  flush_5m: true
  retention_5m_days: 30
  retention_1h_days: 180
  retention_1d_days: 730

alert:
  enabled: true
  evaluate_seconds: 15

security:
  secret_master_key_env: DBOPS_MASTER_KEY
  access_token_minutes: 30
  refresh_token_hours: 24

agent_gateway:
  heartbeat_timeout_seconds: 90
  websocket_path: /api/v1/agent/ws

logging:
  level: info
  format: json
  rotate_days: 30
  rotate_size_mb: 100
  redact_keys: [password, secret, token, access_key, private_key]
